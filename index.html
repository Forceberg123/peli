<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Wings Cave Flyer - WebRTC Multiplayer</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden; font-family: monospace; color: #00ffcc;
    }
    #hud {
      position: fixed; top: 0; left: 0; width: 100%;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; font-weight: bold; z-index: 100;
      background: rgba(5, 8, 15, 0.85); padding: 10px 20px;
      box-sizing: border-box; border-bottom: 1px solid #00ffcc;
    }
    #lobby-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 8, 15, 0.95); z-index: 200;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .btn {
      background: rgba(0,255,204,0.1); border: 2px solid #00ffcc; color: #00ffcc;
      padding: 12px 24px; font-family: inherit; font-size: 16px; font-weight: bold;
      cursor: pointer; margin: 8px; transition: 0.2s;
    }
    .btn:hover { background: #00ffcc; color: #000; }
    input {
      background: #000; border: 1px solid #00ffcc; color: #fff;
      padding: 10px; font-family: inherit; font-size: 16px; text-align: center;
    }
    canvas { display: block; width: 100vw; height: 100vh; background: #0a0d18; }
  </style>
  <!-- PeerJS verkkokirjasto WebRTC-yhteyksiin -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div id="hud">
  <div id="p1-hud">P1 HP: 150 | FUEL: 100 | KILLS: 0</div>
  <div id="status-text" style="color:#ffcc00">Odotetaan yhteyttä...</div>
  <div id="p2-hud" style="color:#ff3366">P2 HP: 150 | FUEL: 100 | KILLS: 0</div>
</div>

<div id="lobby-overlay">
  <h1 style="text-shadow:0 0 10px #00ffcc;">WINGS CAVE FLYER MULTIPLAYER</h1>
  <p>Pelaa kaverin kanssa verkossa (WASD/Space tai Nuolet/Enter)</p>
  <div style="margin-top:20px;">
    <button class="btn" id="btn-host">Luo huone (Host)</button>
  </div>
  <div style="margin-top:15px;">
    <input type="text" id="room-input" placeholder="Syötä Huone-ID" maxlength="6">
    <button class="btn" id="btn-join">Liity peliin</button>
  </div>
  <p id="net-info" style="margin-top:20px; color:#ffcc00;"></p>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

const WORLD = { width: 5000, height: 3000 };
const camera = { x: 0, y: 0 };
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Verkkotila (PeerJS)
let peer = null, conn = null;
let isHost = false;
let clientInputs = {};

document.getElementById('btn-host').onclick = () => {
  document.getElementById('net-info').innerText = "Luodaan huonetta...";
  peer = new Peer();
  peer.on('open', id => {
    let code = id.substring(0, 5).toUpperCase();
    isHost = true;
    document.getElementById('net-info').innerText = "HUONEID: " + code + "\nAnna koodi kaverillesi!";
  });
  peer.on('connection', c => {
    conn = c;
    setupConnection();
  });
};

document.getElementById('btn-join').onclick = () => {
  let code = document.getElementById('room-input').value.trim();
  if (!code) return alert("Syötä koodi!");
  document.getElementById('net-info').innerText = "Yhdistetään...";
  peer = new Peer();
  peer.on('open', () => {
    conn = peer.connect(code);
    setupConnection();
  });
};

function setupConnection() {
  conn.on('open', () => {
    document.getElementById('lobby-overlay').style.display = 'none';
    document.getElementById('status-text').innerText = isHost ? "ISÄNTÄ (P1)" : "LIITTYNYT (P2)";
    startLoop();
  });
  conn.on('data', data => {
    if (isHost) {
      clientInputs = data.inputs;
    } else {
      // Client vastaanottaa maailman tilan
      syncGameState(data);
    }
  });
}

// Luolasto & Fysiikat
const segW = 40, numSegs = Math.ceil(WORLD.width / segW) + 1;
const ceiling = [], floor = [];
for (let i = 0; i < numSegs; i++) {
  ceiling.push(220 + Math.sin(i * 0.07) * 120 + Math.cos(i * 0.18) * 60);
  floor.push(WORLD.height - 220 - Math.cos(i * 0.06) * 130 - Math.sin(i * 0.15) * 70);
}
const bases = [{ x1: 400, x2: 700, y: WORLD.height - 280 }, { x1: 3800, x2: 4100, y: WORLD.height - 280 }];
bases.forEach(b => {
  for (let i = Math.floor(b.x1 / segW); i <= Math.ceil(b.x2 / segW); i++) if (i < numSegs) floor[i] = b.y;
});

class Ship {
  constructor(id, x, y, color) {
    this.id = id; this.x = x; this.y = y; this.color = color;
    this.vx = 0; this.vy = 0; this.angle = -Math.PI/2;
    this.hp = 150; this.fuel = 100; this.kills = 0;
    this.isDead = false; this.docked = false;
  }
  update(ctrl) {
    if (this.isDead) return;
    if (ctrl.left) this.angle -= 0.07;
    if (ctrl.right) this.angle += 0.07;
    if (ctrl.thrust && this.fuel > 0) {
      if (this.docked) { this.docked = false; this.vy = -3.0; }
      this.vx += Math.cos(this.angle) * 0.2;
      this.vy += Math.sin(this.angle) * 0.2;
      this.fuel = Math.max(0, this.fuel - 0.15);
    }
    if (!this.docked) {
      this.vy += 0.05; this.vx *= 0.99; this.vy *= 0.99;
      this.x += this.vx; this.y += this.vy;
    } else {
      this.vx = 0; this.vy = 0;
      if (this.hp < 150) this.hp += 0.8; if (this.fuel < 100) this.fuel += 1.0;
    }
  }
  draw() {
    if (this.isDead) return;
    ctx.save();
    ctx.translate(this.x - camera.x, this.y - camera.y);
    ctx.rotate(this.angle);
    ctx.strokeStyle = this.color; ctx.fillStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(-10,-8); ctx.lineTo(-4,0); ctx.lineTo(-10,8); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

const ships = [
  new Ship(0, 500, WORLD.height - 290, '#00ffcc'),
  new Ship(1, 580, WORLD.height - 290, '#ff3366')
];

function syncGameState(data) {
  data.ships.forEach((s, idx) => {
    ships[idx].x = s.x; ships[idx].y = s.y; ships[idx].angle = s.angle;
    ships[idx].hp = s.hp; ships[idx].fuel = s.fuel; ships[idx].kills = s.kills;
  });
}

function startLoop() {
  function loop() {
    if (isHost) {
      let p1Controls = { left: keys['KeyA']||keys['ArrowLeft'], right: keys['KeyD']||keys['ArrowRight'], thrust: keys['KeyW']||keys['ArrowUp'] };
      let p2Controls = clientInputs;
      ships[0].update(p1Controls);
      ships[1].update(p2Controls);

      // Lähetä tila clientille
      if (conn && conn.open) {
        conn.send({ ships: ships.map(s => ({ x: s.x, y: s.y, angle: s.angle, hp: s.hp, fuel: s.fuel, kills: s.kills })) });
      }
    } else {
      // Client lähettää syötteet hostille
      let myInputs = { left: keys['KeyA']||keys['ArrowLeft'], right: keys['KeyD']||keys['ArrowRight'], thrust: keys['KeyW']||keys['ArrowUp'] };
      if (conn && conn.open) conn.send({ inputs: myInputs });
    }

    // Kamera
    let myShip = isHost ? ships[0] : ships[1];
    camera.x += (myShip.x - canvas.width / 2 - camera.x) * 0.1;
    camera.y += (myShip.y - canvas.height / 2 - camera.y) * 0.1;

    // Piirto
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#181b28'; ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-camera.x, -camera.y);
    for (let i = 0; i < numSegs; i++) ctx.lineTo(i * segW - camera.x, ceiling[i] - camera.y);
    ctx.lineTo(WORLD.width - camera.x, -camera.y); ctx.fill(); ctx.stroke();

    ctx.beginPath();
    for (let i = 0; i < numSegs; i++) ctx.lineTo(i * segW - camera.x, floor[i] - camera.y);
    ctx.lineTo(WORLD.width - camera.x, WORLD.height - camera.y); ctx.lineTo(-camera.x, WORLD.height - camera.y);
    ctx.fill(); ctx.stroke();

    ships.forEach(s => s.draw());
    requestAnimationFrame(loop);
  }
  loop();
}
</script>
</body>
</html>
