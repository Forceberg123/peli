<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Wings Cave Flyer - Single & Multiplayer</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden; font-family: monospace; color: #00ffcc;
    }
    #hud {
      position: fixed; top: 0; left: 0; width: 100%;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; font-weight: bold; z-index: 100;
      background: rgba(5, 8, 15, 0.85); padding: 10px 20px;
      box-sizing: border-box; border-bottom: 1px solid #00ffcc;
    }
    #timer {
      font-size: 16px;
      color: #ffcc00;
    }
    #game-over {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 8, 15, 0.95); z-index: 300;
      flex-direction: column; justify-content: center; align-items: center;
      color: #00ffcc; text-align: center;
    }
    #game-over h1 {
      font-size: 42px; margin-bottom: 10px; text-shadow: 0 0 10px #00ffcc;
    }
    #game-over p {
      font-size: 18px; color: #fff; margin-bottom: 25px;
    }
    #lobby-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 8, 15, 0.95); z-index: 200;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center;
    }
    .btn {
      background: rgba(0,255,204,0.1); border: 2px solid #00ffcc; color: #00ffcc;
      padding: 12px 24px; font-family: inherit; font-size: 16px; font-weight: bold;
      cursor: pointer; margin: 8px; transition: 0.2s;
    }
    .btn:hover { background: #00ffcc; color: #000; }
    input {
      background: #000; border: 1px solid #00ffcc; color: #fff;
      padding: 10px; font-family: inherit; font-size: 16px; text-align: center;
      width: 250px;
    }
    #status-msg { margin-top: 15px; font-size: 14px; color: #ffcc00; max-width: 80%; line-height: 1.4; }
    canvas { display: block; width: 100vw; height: 100vh; background: #0a0d18; }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div id="hud">
  <div id="p1-hud" style="color:#00ffcc">P1 HP: 150 | FUEL: 100 | KILLS: 0</div>
  <div id="timer">Aikaa jäljellä: 60s</div>
  <div id="p2-hud" style="color:#ff3366; display:none;">P2 HP: 150 | FUEL: 100 | KILLS: 0</div>
</div>

<div id="game-over">
  <h1 id="winner-title">ERÄ PÄÄTTYI!</h1>
  <p id="final-score">Tapot: 0</p>
  <p style="font-size: 14px; color: #88aacc;">Paina Space tai Enter aloittaaksesi uuden erän</p>
</div>

<div id="lobby-overlay">
  <h1 style="text-shadow:0 0 10px #00ffcc; margin-bottom: 5px;">WINGS CAVE FLYER</h1>
  <p style="color: #88aacc; margin-bottom: 20px;">Valitse pelimuoto</p>
  
  <div>
    <button class="btn" id="btn-solo" style="background:rgba(255,204,0,0.1); border-color:#ffcc00; color:#ffcc00;">Pelaa yksin (Testi)</button>
  </div>
  <div style="margin-top: 15px; border-top: 1px solid #223344; padding-top: 15px;">
    <button class="btn" id="btn-host">Luo verkkopelihuone (Host)</button>
  </div>
  <div style="margin-top:10px;">
    <input type="text" id="room-input" placeholder="Syötä Huone-ID tähän">
    <button class="btn" id="btn-join">Liity peliin</button>
  </div>
  <div id="status-msg"></div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

const WORLD = { width: 5000, height: 3000 };
const camera = { x: 0, y: 0 };
const keys = {};
window.addEventListener('keydown', e => { 
  keys[e.code] = true; 
  if (matchEnded && (e.code === 'Space' || e.code === 'Enter')) {
    restartMatch();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const peerConfig = {
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]
  }
};

let peer = null, conn = null;
let isHost = false, isSinglePlayer = false;
let clientInputs = {};
const statusEl = document.getElementById('status-msg');

let matchTime = 60;
let matchEnded = false;
let timerInterval = null;
let gameStarted = false;

function startTimer() {
  clearInterval(timerInterval);
  matchTime = 60;
  matchEnded = false;
  document.getElementById('game-over').style.display = 'none';
  
  timerInterval = setInterval(() => {
    if (matchTime > 0) {
      matchTime--;
      let timerEl = document.getElementById('timer');
      if (timerEl) timerEl.innerText = `Aikaa jäljellä: ${matchTime}s`;
    } else {
      endMatch();
    }
  }, 1000);
}

function endMatch() {
  clearInterval(timerInterval);
  matchEnded = true;
  
  const p1Kills = ships[0].kills;
  const p2Kills = ships[1].kills;
  
  const titleEl = document.getElementById('winner-title');
  const scoreEl = document.getElementById('final-score');
  
  if (isSinglePlayer) {
    titleEl.innerText = "ERÄ PÄÄTTYI!";
    titleEl.style.color = "#ffcc00";
    scoreEl.innerText = `Lennon kesto 60s takana!`;
  } else if (p1Kills > p2Kills) {
    titleEl.innerText = "PELAAJA 1 VOITTI!";
    titleEl.style.color = "#00ffcc";
    scoreEl.innerText = `Tapot - P1: ${p1Kills} | P2: ${p2Kills}`;
  } else if (p2Kills > p1Kills) {
    titleEl.innerText = "PELAAJA 2 VOITTI!";
    titleEl.style.color = "#ff3366";
    scoreEl.innerText = `Tapot - P1: ${p1Kills} | P2: ${p2Kills}`;
  } else {
    titleEl.innerText = "TASAPELI!";
    titleEl.style.color = "#ffcc00";
    scoreEl.innerText = `Tapot - P1: ${p1Kills} | P2: ${p2Kills}`;
  }
  
  document.getElementById('game-over').style.display = 'flex';
}

function restartMatch() {
  ships[0].kills = 0;
  ships[1].kills = 0;
  ships[0].reset(true);
  ships[1].reset(true);
  bullets.length = 0;
  particles.length = 0;
  startTimer();
}

// Yksinpelin käynnistys suoraan
document.getElementById('btn-solo').onclick = () => {
  isSinglePlayer = true;
  isHost = true;
  document.getElementById('lobby-overlay').style.display = 'none';
  document.getElementById('status-text').innerText = "YKSINPELI (Testi)";
  document.getElementById('p2-hud').style.display = 'none';
  
  startTimer();
  if (!gameStarted) {
    gameStarted = true;
    startLoop();
  }
};

document.getElementById('btn-host').onclick = () => {
  statusEl.innerText = "Luodaan huonetta...";
  if (peer) peer.destroy();
  peer = new Peer(peerConfig);
  peer.on('open', id => {
    isHost = true;
    isSinglePlayer = false;
    statusEl.innerHTML = `HUONE LUOTU!<br>Kopioi tämä koodi kaverillesi:<br><b style="font-size:16px; color:#00ffcc;">${id}</b>`;
  });
  peer.on('connection', c => { conn = c; setupConnection(); });
  peer.on('error', err => { statusEl.innerText = "Virhe: " + err.type; });
};

document.getElementById('btn-join').onclick = () => {
  let code = document.getElementById('room-input').value.trim();
  if (!code) { statusEl.innerText = "Syötä huonekoodi!"; return; }
  statusEl.innerText = "Yhdistetään...";
  if (peer) peer.destroy();
  peer = new Peer(peerConfig);
  peer.on('open', () => {
    conn = peer.connect(code, { reliable: true });
    setupConnection();
  });
  peer.on('error', () => { statusEl.innerText = "Yhteysvirhe: Tarkista koodi!"; });
};

function setupConnection() {
  conn.on('open', () => {
    isSinglePlayer = false;
    document.getElementById('lobby-overlay').style.display = 'none';
    document.getElementById('status-text').innerText = isHost ? "ISÄNTÄ (P1)" : "LIITTYNYT (P2)";
    document.getElementById('p2-hud').style.display = 'block';
    startTimer();
    if (!gameStarted) {
      gameStarted = true;
      startLoop();
    }
  });

  conn.on('data', data => {
    if (isHost) {
      clientInputs = data.inputs || {};
    } else {
      syncGameState(data);
    }
  });

  conn.on('close', () => { alert("Yhteys katkesi!"); location.reload(); });
}
