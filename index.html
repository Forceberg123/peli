<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Wings Cave Flyer - Match Mode</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: monospace;
    }
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
      z-index: 100;
      background: rgba(5, 8, 15, 0.85);
      padding: 10px 20px;
      box-sizing: border-box;
      border-bottom: 1px solid #00ffcc;
    }
    #timer {
      font-size: 18px;
      color: #ffcc00;
    }
    #game-over {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 8, 15, 0.9);
      z-index: 200;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #00ffcc;
    }
    #game-over h1 {
      font-size: 48px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #00ffcc;
    }
    #game-over p {
      font-size: 20px;
      color: #fff;
      margin-bottom: 25px;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #0a0d18;
    }
  </style>
</head>
<body>

<div id="hud">
  <div id="p1-hud" style="color:#00ffcc">P1 (WASD) HP: 150 | FUEL: 100 | KILLS: 0</div>
  <div id="timer">Aikaa jäljellä: 60s</div>
  <div id="p2-hud" style="color:#ff3366">P2 (Nuolet) HP: 150 | FUEL: 100 | KILLS: 0</div>
</div>

<div id="game-over">
  <h1 id="winner-title">VOITTAJA!</h1>
  <p id="final-score">P1: 0 - P2: 0</p>
  <p style="font-size: 14px; color: #88aacc;">Paina Space tai Enter aloittaaksesi uuden erän</p>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const WORLD = { width: 5000, height: 3000 };
const camera = { x: 0, y: 0 };

const keys = {};
window.addEventListener('keydown', e => { 
  keys[e.code] = true; 
  if (matchEnded && (e.code === 'Space' || e.code === 'Enter')) {
    restartMatch();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Äänet
let audioCtx = null;
function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'laser') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(350, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'thrust') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(60, now);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'boom') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(90, now);
      osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    }
  } catch(e){}
}

// Luolasto
const segW = 40;
const numSegs = Math.ceil(WORLD.width / segW) + 1;
const ceiling = [];
const floor = [];

for (let i = 0; i < numSegs; i++) {
  ceiling.push(220 + Math.sin(i * 0.07) * 120 + Math.cos(i * 0.18) * 60);
  floor.push(WORLD.height - 220 - Math.cos(i * 0.06) * 130 - Math.sin(i * 0.15) * 70);
}

const bases = [
  { x1: 400, x2: 700, y: WORLD.height - 280 },
  { x1: 2000, x2: 2300, y: WORLD.height - 320 },
  { x1: 3800, x2: 4100, y: WORLD.height - 280 }
];

bases.forEach(b => {
  let start = Math.floor(b.x1 / segW);
  let end = Math.ceil(b.x2 / segW);
  for (let i = start; i <= end; i++) {
    if (i < numSegs) floor[i] = b.y;
  }
});

const obstacles = [
  { x: 1200, y: 1200, radius: 140 },
  { x: 1600, y: 800, radius: 100 },
  { x: 2800, y: 1500, radius: 180 },
  { x: 3400, y: 900, radius: 120 },
  { x: 4400, y: 1300, radius: 150 }
];

function getFloorY(x) {
  let i = Math.floor(x / segW);
  if (i < 0) return floor[0];
  if (i >= numSegs - 1) return floor[numSegs - 1];
  let t = (x % segW) / segW;
  return floor[i] * (1 - t) + floor[i + 1] * t;
}

function getCeilingY(x) {
  let i = Math.floor(x / segW);
  if (i < 0) return ceiling[0];
  if (i >= numSegs - 1) return ceiling[numSegs - 1];
  let t = (x % segW) / segW;
  return ceiling[i] * (1 - t) + ceiling[i + 1] * t;
}

// Erän tila
let matchTime = 60;
let matchEnded = false;
let timerInterval = null;

function startTimer() {
  clearInterval(timerInterval);
  matchTime = 60;
  matchEnded = false;
  document.getElementById('game-over').style.display = 'none';
  
  timerInterval = setInterval(() => {
    if (matchTime > 0) {
      matchTime--;
      document.getElementById('timer').innerText = `Aikaa jäljellä: ${matchTime}s`;
    } else {
      endMatch();
    }
  }, 1000);
}

function endMatch() {
  clearInterval(timerInterval);
  matchEnded = true;
  
  const p1Kills = ships[0].kills;
  const p2Kills = ships[1].kills;
  
  const titleEl = document.getElementById('winner-title');
  const scoreEl = document.getElementById('final-score');
  
  if (p1Kills > p2Kills) {
    titleEl.innerText = "PELAAJA 1 VOITTI!";
    titleEl.style.color = "#00ffcc";
  } else if (p2Kills > p1Kills) {
    titleEl.innerText = "PELAAJA 2 VOITTI!";
    titleEl.style.color = "#ff3366";
  } else {
    titleEl.innerText = "TASAPELI!";
    titleEl.style.color = "#ffcc00";
  }
  
  scoreEl.innerText = `Tapot - P1 (Sininen): ${p1Kills}  |  P2 (Punainen): ${p2Kills}`;
  document.getElementById('game-over').style.display = 'flex';
}

function restartMatch() {
  ships[0].kills = 0;
  ships[1].kills = 0;
  ships[0].reset();
  ships[1].reset();
  bullets.length = 0;
  particles.length = 0;
  startTimer();
}

// Alus
class Ship {
  constructor(id, x, y, color, controls) {
    this.id = id;
    this.startX = x;
    this.startY = y;
    this.color = color;
    this.controls = controls;
    this.kills = 0;
    this.reset();
  }

  reset() {
    this.x = this.startX;
    this.y = this.startY;
    this.vx = 0;
    this.vy = 0;
    this.angle = -Math.PI / 2;
    this.hp = 150;
    this.fuel = 100;
    this.isDead = false;
    this.dockedBase = null;
    this.cooldown = 0;
  }

  update(bullets, particles) {
    if (this.isDead || matchEnded) return;

    if (keys[this.controls.left]) this.angle -= 0.07;
    if (keys[this.controls.right]) this.angle += 0.07;

    if (keys[this.controls.thrust] && this.fuel > 0) {
      if (this.dockedBase) {
        this.dockedBase = null;
        this.vy = -3.0;
      }
      this.vx += Math.cos(this.angle) * 0.2;
      this.vy += Math.sin(this.angle) * 0.2;
      this.fuel = Math.max(0, this.fuel - 0.15);
      playSound('thrust');

      particles.push({
        x: this.x - Math.cos(this.angle) * 12,
        y: this.y - Math.sin(this.angle) * 12,
        vx: -Math.cos(this.angle) * 2 + (Math.random() - 0.5),
        vy: -Math.sin(this.angle) * 2 + (Math.random() - 0.5),
        life: 12, color: '#ffaa00'
      });
    }

    if (keys[this.controls.fire] && this.cooldown <= 0) {
      bullets.push({
        x: this.x + Math.cos(this.angle) * 16,
        y: this.y + Math.sin(this.angle) * 16,
        vx: Math.cos(this.angle) * 12,
        vy: Math.sin(this.angle) * 12,
        owner: this.id, life: 80
      });
      playSound('laser');
      this.cooldown = 10;
    }
    if (this.cooldown > 0) this.cooldown--;

    if (!this.dockedBase) {
      this.vy += 0.05;
      this.vx *= 0.99;
      this.vy *= 0.99;
      this.x += this.vx;
      this.y += this.vy;
    } else {
      this.vx = 0;
      this.vy = 0;
      this.y = this.dockedBase.y - 10;
      this.angle += (-Math.PI / 2 - this.angle) * 0.2;

      if (this.hp < 150) this.hp = Math.min(150, this.hp + 0.8);
      if (this.fuel < 100) this.fuel = Math.min(100, this.fuel + 1.0);
    }

    if (this.hp < 60 && Math.random() < 0.4) {
      particles.push({
        x: this.x, y: this.y,
        vx: (Math.random() - 0.5), vy: -1,
        life: 20, color: '#555'
      });
    }

    if (!this.dockedBase && this.vy >= 0) {
      for (let b of bases) {
        if (this.x >= b.x1 && this.x <= b.x2 && Math.abs(this.y - (b.y - 10)) < 15) {
          if (Math.hypot(this.vx, this.vy) < 4.0) {
            this.dockedBase = b;
            this.y = b.y - 10;
            this.vx = 0;
            this.vy = 0;
            break;
          }
        }
      }
    }

    let ceilY = getCeilingY(this.x);
    let floorY = getFloorY(this.x);
    let hitObstacle = false;

    for (let obs of obstacles) {
      if (Math.hypot(this.x - obs.x, this.y - obs.y) < obs.radius + 10) {
        hitObstacle = true;
        break;
      }
    }

    let hitWall = (this.x <= 30 || this.x >= WORLD.width - 30);

    if (!this.dockedBase && (hitWall || hitObstacle || this.y <= ceilY + 10 || this.y >= floorY - 10)) {
      let speed = Math.hypot(this.vx, this.vy);
      if (speed > 4.0 || hitWall) {
        this.explode(particles, null);
      } else if (speed > 1.0) {
        this.hp -= (speed - 1.0) * 8;
        this.vx *= -0.4;
        this.vy *= -0.4;
        if (this.hp <= 0) this.explode(particles, null);
      } else {
        this.vx *= -0.2;
        this.vy *= -0.2;
      }
    }
  }

  explode(particles, killerId) {
    this.isDead = true;
    this.dockedBase = null;
    playSound('boom');

    if (killerId !== null && killerId !== undefined) {
      ships[killerId].kills++;
    }

    for (let i = 0; i < 30; i++) {
      particles.push({
        x: this.x, y: this.y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        life: 40, color: i % 2 === 0 ? '#ff3300' : '#ffcc00'
      });
    }
    setTimeout(() => {
      if (!matchEnded) this.reset();
    }, 2000);
  }

  draw() {
    if (this.isDead) return;

    ctx.save();
    ctx.translate(this.x - camera.x, this.y - camera.y);
    ctx.rotate(this.angle);

    ctx.strokeStyle = this.color;
    ctx.fillStyle = '#05080f';
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(16, 0);
    ctx.lineTo(-10, -8);
    ctx.lineTo(-4, 0);
    ctx.lineTo(-10, 8);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();

    if (this.dockedBase) {
      ctx.fillStyle = '#00ff66';
      ctx.font = '12px monospace';
      ctx.fillText("TANKKAA...", this.x - 30 - camera.x, this.y - 22 - camera.y);
    }
  }
}

const ships = [
  new Ship(0, 500, WORLD.height - 290, '#00ffcc', { left: 'KeyA', right: 'KeyD', thrust: 'KeyW', fire: 'Space' }),
  new Ship(1, 580, WORLD.height - 290, '#ff3366', { left: 'ArrowLeft', right: 'ArrowRight', thrust: 'ArrowUp', fire: 'Enter' })
];

const bullets = [];
const particles = [];

function loop() {
  ships.forEach(s => s.update(bullets, particles));

  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life--;

    let hitObs = obstacles.some(o => Math.hypot(b.x - o.x, b.y - o.y) < o.radius);
    if (b.x <= 0 || b.x >= WORLD.width || b.y <= getCeilingY(b.x) || b.y >= getFloorY(b.x) || hitObs) {
      bullets.splice(i, 1);
      continue;
    }

    for (let s of ships) {
      if (!s.isDead && s.id !== b.owner) {
        if (Math.hypot(s.x - b.x, s.y - b.y) < 14) {
          s.hp -= 25;
          if (s.hp <= 0) s.explode(particles, b.owner);
          bullets.splice(i, 1);
          break;
        }
      }
    }

    if (b.life <= 0) bullets.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (!ships[0].isDead) {
    camera.x += (ships[0].x - canvas.width / 2 - camera.x) * 0.1;
    camera.y += (ships[0].y - canvas.height / 2 - camera.y) * 0.1;
    camera.x = Math.max(0, Math.min(WORLD.width - canvas.width, camera.x));
    camera.y = Math.max(0, Math.min(WORLD.height - canvas.height, camera.y));
  }

  // PIIRTO
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Katto
  ctx.fillStyle = '#181b28';
  ctx.strokeStyle = '#00ffcc';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-camera.x, -camera.y);
  for (let i = 0; i < numSegs; i++) ctx.lineTo(i * segW - camera.x, ceiling[i] - camera.y);
  ctx.lineTo(WORLD.width - camera.x, -camera.y);
  ctx.fill(); ctx.stroke();

  // Lattia
  ctx.beginPath();
  for (let i = 0; i < numSegs; i++) ctx.lineTo(i * segW - camera.x, floor[i] - camera.y);
  ctx.lineTo(WORLD.width - camera.x, WORLD.height - camera.y);
  ctx.lineTo(-camera.x, WORLD.height - camera.y);
  ctx.fill(); ctx.stroke();

  // Energiaseinät
  ctx.fillStyle = '#ff3366';
  ctx.fillRect(0 - camera.x, 0, 30, WORLD.height);
  ctx.fillRect(WORLD.width - 30 - camera.x, 0, 30, WORLD.height);

  // Ilmaesteet / Saarekkeet
  ctx.fillStyle = '#181b28';
  ctx.strokeStyle = '#00ffcc';
  ctx.lineWidth = 3;
  obstacles.forEach(o => {
    ctx.beginPath();
    ctx.arc(o.x - camera.x, o.y - camera.y, o.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  });

  // Tukikohdat
  ctx.strokeStyle = '#00ff66';
  ctx.lineWidth = 5;
  bases.forEach(b => {
    ctx.beginPath();
    ctx.moveTo(b.x1 - camera.x, b.y - camera.y);
    ctx.lineTo(b.x2 - camera.x, b.y - camera.y);
    ctx.stroke();
  });

  // Partikkelit
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - camera.x, p.y - camera.y, 3, 3);
  });

  // Ammukset
  ctx.fillStyle = '#ffcc00';
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x - camera.x, b.y - camera.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });

  // Alukset
  ships.forEach(s => s.draw());

  document.getElementById('p1-hud').innerText = `P1 (WASD) HP: ${Math.ceil(ships[0].hp)} | FUEL: ${Math.ceil(ships[0].fuel)} | KILLS: ${ships[0].kills}`;
  document.getElementById('p2-hud').innerText = `P2 (Nuolet) HP: ${Math.ceil(ships[1].hp)} | FUEL: ${Math.ceil(ships[1].fuel)} | KILLS: ${ships[1].kills}`;

  requestAnimationFrame(loop);
}

window.onload = function() {
  resize();
  startTimer();
  loop();
};
</script>
</body>
</html>
