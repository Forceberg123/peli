<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Wings Cave Flyer - Solid Single & Multi</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden; font-family: monospace; color: #00ffcc;
    }
    #hud {
      position: fixed; top: 0; left: 0; width: 100%;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; font-weight: bold; z-index: 100;
      background: rgba(5, 8, 15, 0.85); padding: 10px 20px;
      box-sizing: border-box; border-bottom: 1px solid #00ffcc;
    }
    #timer { font-size: 16px; color: #ffcc00; }
    #game-over {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 8, 15, 0.95); z-index: 300;
      flex-direction: column; justify-content: center; align-items: center;
      color: #00ffcc; text-align: center;
    }
    #game-over h1 { font-size: 42px; margin-bottom: 10px; text-shadow: 0 0 10px #00ffcc; }
    #game-over p { font-size: 18px; color: #fff; margin-bottom: 25px; }
    #lobby-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 8, 15, 0.95); z-index: 200;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center;
    }
    .btn {
      background: rgba(0,255,204,0.1); border: 2px solid #00ffcc; color: #00ffcc;
      padding: 12px 24px; font-family: inherit; font-size: 16px; font-weight: bold;
      cursor: pointer; margin: 8px; transition: 0.2s;
    }
    .btn:hover { background: #00ffcc; color: #000; }
    .btn-solo { background: rgba(255,204,0,0.1); border-color: #ffcc00; color: #ffcc00; }
    .btn-solo:hover { background: #ffcc00; color: #000; }
    input {
      background: #000; border: 1px solid #00ffcc; color: #fff;
      padding: 10px; font-family: inherit; font-size: 16px; text-align: center;
      width: 250px;
    }
    #status-msg { margin-top: 15px; font-size: 14px; color: #ffcc00; max-width: 80%; line-height: 1.4; }
    canvas { display: block; width: 100vw; height: 100vh; background: #0a0d18; }
  </style>
</head>
<body>

<div id="hud">
  <div id="p1-hud" style="color:#00ffcc">P1 HP: 150 | FUEL: 100 | KILLS: 0</div>
  <div id="timer">Aikaa jäljellä: 60s</div>
  <div id="p2-hud" style="color:#ff3366; display:none;">P2 HP: 150 | FUEL: 100 | KILLS: 0</div>
</div>

<div id="game-over">
  <h1 id="winner-title">ERÄ PÄÄTTYI!</h1>
  <p id="final-score">Tapot: 0</p>
  <p style="font-size: 14px; color: #88aacc;">Paina Space tai Enter aloittaaksesi uuden erän</p>
</div>

<div id="lobby-overlay">
  <h1 style="text-shadow:0 0 10px #00ffcc; margin-bottom: 5px;">WINGS CAVE FLYER</h1>
  <p style="color: #88aacc; margin-bottom: 20px;">Valitse pelimuoto</p>
  
  <div>
    <button class="btn btn-solo" id="btn-solo">Pelaa yksin (Testi)</button>
  </div>
  <div style="margin-top: 15px; border-top: 1px solid #223344; padding-top: 15px;">
    <button class="btn" id="btn-host">Luo huone (Host)</button>
  </div>
  <div style="margin-top:10px;">
    <input type="text" id="room-input" placeholder="Syötä Huone-ID tähän">
    <button class="btn" id="btn-join">Liity peliin</button>
  </div>
  <div id="status-msg"></div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

const WORLD = { width: 5000, height: 3000 };
const camera = { x: 0, y: 0 };
const keys = {};

window.addEventListener('keydown', e => { 
  keys[e.code] = true; 
  if (matchEnded && (e.code === 'Space' || e.code === 'Enter')) {
    restartMatch();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ÄÄNIJÄRJESTELMÄ (Web Audio API)
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playShootSound() {
  try {
    initAudio();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(550, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);
  } catch (e) {}
}

function playBumpSound() {
  try {
    initAudio();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  } catch (e) {}
}

function playExplosionSound() {
  try {
    initAudio();
    let bufferSize = audioCtx.sampleRate * 0.5;
    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    let noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    let filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(300, audioCtx.currentTime);
    filter.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.5);
    let gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
  } catch (e) {}
}

let rechargeOsc = null, rechargeGain = null;
function setRechargeSound(active) {
  try {
    initAudio();
    if (active && !rechargeOsc) {
      rechargeOsc = audioCtx.createOscillator();
      rechargeGain = audioCtx.createGain();
      rechargeOsc.type = 'sine';
      rechargeOsc.frequency.setValueAtTime(440, audioCtx.currentTime);
      rechargeGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      rechargeOsc.connect(rechargeGain);
      rechargeGain.connect(audioCtx.destination);
      rechargeOsc.start();
    } else if (!active && rechargeOsc) {
      rechargeOsc.stop(); rechargeOsc.disconnect();
      rechargeOsc = null; rechargeGain = null;
    }
  } catch (e) {}
}

// PELIN MUUTTUJAT
let peer = null, conn = null;
let isHost = false, isSinglePlayer = false;
let clientInputs = {};
let loopRunning = false;
const statusEl = document.getElementById('status-msg');

let matchTime = 60, matchEnded = false, timerInterval = null;

function startTimer() {
  clearInterval(timerInterval);
  matchTime = 60;
  matchEnded = false;
  document.getElementById('game-over').style.display = 'none';
  timerInterval = setInterval(() => {
    if (matchTime > 0) {
      matchTime--;
      document.getElementById('timer').innerText = `Aikaa jäljellä: ${matchTime}s`;
    } else {
      endMatch();
    }
  }, 1000);
}

function endMatch() {
  clearInterval(timerInterval);
  matchEnded = true;
  setRechargeSound(false);
  const p1Kills = ships[0].kills, p2Kills = ships[1].kills;
  const titleEl = document.getElementById('winner-title'), scoreEl = document.getElementById('final-score');
  
  if (isSinglePlayer) {
    titleEl.innerText = "ERÄ PÄÄTTYI!"; titleEl.style.color = "#ffcc00";
    scoreEl.innerText = `Kerätyt tapot: ${p1Kills}`;
  } else if (p1Kills > p2Kills) {
    titleEl.innerText = "PELAAJA 1 VOITTI!"; titleEl.style.color = "#00ffcc";
    scoreEl.innerText = `Tapot - P1: ${p1Kills} | P2: ${p2Kills}`;
  } else if (p2Kills > p1Kills) {
    titleEl.innerText = "PELAAJA 2 VOITTI!"; titleEl.style.color = "#ff3366";
    scoreEl.innerText = `Tapot - P1: ${p1Kills} | P2: ${p2Kills}`;
  } else {
    titleEl.innerText = "TASAPELI!"; titleEl.style.color = "#ffcc00";
    scoreEl.innerText = `Tapot - P1: ${p1Kills} | P2: ${p2Kills}`;
  }
  document.getElementById('game-over').style.display = 'flex';
}

function restartMatch() {
  ships[0].kills = 0; ships[1].kills = 0;
  ships[0].reset(true); ships[1].reset(true);
  bullets.length = 0; particles.length = 0;
  startTimer();
}

// LUOLASTO
const segW = 30, numSegs = Math.ceil(WORLD.width / segW) + 1;
const ceiling = [], floor = [];
for (let i = 0; i < numSegs; i++) {
  let midPoint = 1500 + Math.sin(i * 0.03) * 600 + Math.cos(i * 0.08) * 300;
  let caveHeight = 350 + Math.sin(i * 0.05) * 220 + Math.cos(i * 0.12) * 150;
  ceiling.push(Math.max(100, midPoint - caveHeight / 2));
  floor.push(Math.min(WORLD.height - 100, midPoint + caveHeight / 2));
}

const bases = [
  { x1: 300, x2: 600, y: WORLD.height - 350 },
  { x1: 2300, x2: 2600, y: 1600 },
  { x1: 4200, x2: 4500, y: WORLD.height - 350 }
];
bases.forEach(b => {
  let startI = Math.floor(b.x1 / segW), endI = Math.ceil(b.x2 / segW);
  for (let i = startI; i <= endI; i++) {
    if (i < numSegs) { floor[i] = b.y; ceiling[i] = Math.min(ceiling[i], b.y - 450); }
  }
});

const obstacles = [
  { x: 1000, y: 1300, radius: 110 }, { x: 1500, y: 1700, radius: 130 },
  { x: 1900, y: 1100, radius: 90 }, { x: 3100, y: 1600, radius: 150 },
  { x: 3600, y: 1200, radius: 100 }, { x: 4000, y: 1800, radius: 120 }
];

function getFloorY(x) {
  let i = Math.floor(x / segW);
  if (i < 0) return floor[0];
  if (i >= numSegs - 1) return floor[numSegs - 1];
  let t = (x % segW) / segW;
  return floor[i] * (1 - t) + floor[i + 1] * t;
}
function getCeilingY(x) {
  let i = Math.floor(x / segW);
  if (i < 0) return ceiling[0];
  if (i >= numSegs - 1) return ceiling[numSegs - 1];
  let t = (x % segW) / segW;
  return ceiling[i] * (1 - t) + ceiling[i + 1] * t;
}

class Ship {
  constructor(id, x, y, color) {
    this.id = id; this.startX = x; this.startY = y; this.color = color;
    this.kills = 0;
    this.reset(true);
  }
  reset(fullReset = false) {
    this.x = this.startX; this.y = this.startY;
    this.vx = 0; this.vy = 0; this.angle = -Math.PI/2;
    this.hp = 150; this.fuel = 100;
    if (fullReset) this.kills = 0;
    this.isDead = false; this.dockedBase = null; this.cooldown = 0;
    if (this.id === 0) setRechargeSound(false);
  }
  update(ctrl, bullets, particles) {
    if (this.isDead || matchEnded) return;

    if (ctrl.left) this.angle -= 0.07;
    if (ctrl.right) this.angle += 0.07;

    if (ctrl.thrust && this.fuel > 0) {
      if (this.dockedBase) { this.dockedBase = null; this.vy = -3.0; setRechargeSound(false); }
      this.vx += Math.cos(this.angle) * 0.2;
      this.vy += Math.sin(this.angle) * 0.2;
      this.fuel = Math.max(0, this.fuel - 0.15);
      particles.push({
        x: this.x - Math.cos(this.angle) * 12, y: this.y - Math.sin(this.angle) * 12,
        vx: -Math.cos(this.angle) * 2, vy: -Math.sin(this.angle) * 2, life: 12, color: '#ffaa00'
      });
    }

    if (ctrl.fire && this.cooldown <= 0) {
      bullets.push({
        x: this.x + Math.cos(this.angle) * 16, y: this.y + Math.sin(this.angle) * 16,
        vx: Math.cos(this.angle) * 13, vy: Math.sin(this.angle) * 13, owner: this.id, life: 80
      });
      this.vx -= Math.cos(this.angle) * 0.35;
      this.vy -= Math.sin(this.angle) * 0.35;
      playShootSound();
      this.cooldown = 12;
    }
    if (this.cooldown > 0) this.cooldown--;

    if (!this.dockedBase) {
      this.vy += 0.05; this.vx *= 0.99; this.vy *= 0.99;
      this.x += this.vx; this.y += this.vy;
      if (this.id === 0) setRechargeSound(false);
    } else {
      this.vx = 0; this.vy = 0;
      this.y = this.dockedBase.y - 10;
      this.angle += (-Math.PI / 2 - this.angle) * 0.2;
      if (this.hp < 150 || this.fuel < 100) {
        if (this.id === 0) setRechargeSound(true);
        if (this.hp < 150) this.hp = Math.min(150, this.hp + 0.8);
        if (this.fuel < 100) this.fuel = Math.min(100, this.fuel + 1.0);
      } else {
        if (this.id === 0) setRechargeSound(false);
      }
    }

    if (!this.dockedBase && this.vy >= 0) {
      for (let b of bases) {
        if (this.x >= b.x1 && this.x <= b.x2 && Math.abs(this.y - (b.y - 10)) < 15) {
          if (Math.hypot(this.vx, this.vy) < 4.0) {
            this.dockedBase = b; this.y = b.y - 10; this.vx = 0; this.vy = 0; break;
          }
        }
      }
    }

    let ceilY = getCeilingY(this.x), floorY = getFloorY(this.x);
    let hitObstacle = obstacles.some(o => Math.hypot(this.x - o.x, this.y - o.y) < o.radius + 10);
    let hitWall = (this.x <= 30 || this.x >= WORLD.width - 30);

    if (!this.dockedBase && (hitWall || hitObstacle || this.y <= ceilY + 10 || this.y >= floorY - 10)) {
      let speed = Math.hypot(this.vx, this.vy);
      if (speed > 4.0 || hitWall) {
        this.explode(particles, null);
      } else {
        this.hp -= 25; this.vx *= -0.4; this.vy *= -0.4;
        playBumpSound();
        if (this.hp <= 0) this.explode(particles, null);
      }
    }
  }

  explode(particles, killerId) {
    this.isDead = true; this.dockedBase = null;
    if (this.id === 0) setRechargeSound(false);
    playExplosionSound();
    if (killerId !== null && killerId !== undefined) ships[killerId].kills++;
    for (let i = 0; i < 25; i++) {
      particles.push({ x: this.x, y: this.y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, life: 30, color: '#ff3300' });
    }
    setTimeout(() => { if (!matchEnded) this.reset(false); }, 2000);
  }

  draw() {
    if (this.isDead) return;
    ctx.save();
    ctx.translate(this.x - camera.x, this.y - camera.y);
    ctx.rotate(this.angle);
    ctx.strokeStyle = this.color; ctx.fillStyle = '#05080f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(-10,-8); ctx.lineTo(-4,0); ctx.lineTo(-10,8); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();

    if (this.dockedBase) {
      ctx.fillStyle = '#00ff66'; ctx.font = '12px monospace';
      ctx.fillText("TANKKAA...", this.x - 30 - camera.x, this.y - 22 - camera.y);
    }
  }
}

const ships = [
  new Ship(0, 500, 800, '#00ffcc'),
  new Ship(1, 600, 800, '#ff3366')
];
const bullets = [], particles = [];

function startGameLoop() {
  if (loopRunning) return;
  loopRunning = true;

  function loop() {
    if (!matchEnded) {
      if (isSinglePlayer) {
        let p1Ctrl = { left: keys['KeyA']||keys['ArrowLeft'], right: keys['KeyD']||keys['ArrowRight'], thrust: keys['KeyW']||keys['ArrowUp'], fire: keys['Space'] };
        ships[0].update(p1Ctrl, bullets, particles);
      } else if (isHost) {
        let p1Ctrl = { left: keys['KeyA']||keys['ArrowLeft'], right: keys['KeyD']||keys['ArrowRight'], thrust: keys['KeyW']||keys['ArrowUp'], fire: keys['Space'] };
        let p2Ctrl = { left: clientInputs.left||false, right: clientInputs.right||false, thrust: clientInputs.thrust||false, fire: clientInputs.fire||false };
        ships[0].update(p1Ctrl, bullets, particles);
        ships[1].update(p2Ctrl, bullets, particles);

        if (conn && conn.open) {
          conn.send({
            ships: ships.map(s => ({ x: s.x, y: s.y, angle: s.angle, hp: s.hp, fuel: s.fuel, kills: s.kills, isDead: s.isDead, dockedBase: s.dockedBase })),
            bullets, particles, matchTime, matchEnded
          });
        }
      } else {
        let myCtrl = { left: keys['KeyA']||keys['ArrowLeft'], right: keys['KeyD']||keys['ArrowRight'], thrust: keys['KeyW']||keys['ArrowUp'], fire: keys['Space']||keys['Enter'] };
        if (conn && conn.open) conn.send({ inputs: myCtrl });
      }

      if (isHost || isSinglePlayer) {
        for (let i = bullets.length - 1; i >= 0; i--) {
          let b = bullets[i];
          b.x += b.vx; b.y += b.vy; b.vy += 0.04; b.life--;
          let hitObs = obstacles.some(o => Math.hypot(b.x - o.x, b.y - o.y) < o.radius);
          if (b.x <= 0 || b.x >= WORLD.width || b.y <= getCeilingY(b.x) || b.y >= getFloorY(b.x) || hitObs || b.life <= 0) {
            bullets.splice(i, 1); continue;
          }
          if (!isSinglePlayer) {
            for (let s of ships) {
              if (!s.isDead && s.id !== b.owner && Math.hypot(s.x - b.x, s.y - b.y) < 14) {
                s.hp -= 25; if (s.hp <= 0) s.explode(particles, b.owner);
                bullets.splice(i, 1); break;
              }
            }
          }
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].x += particles[i].vx; particles[i].y += particles[i].vy; particles[i].life--;
          if (particles[i].life <= 0) particles.splice(i, 1);
        }
      }
    }

    let activeShip = (isSinglePlayer || isHost) ? ships[0] : ships[1];
    camera.x += (activeShip.x - canvas.width / 2 - camera.x) * 0.1;
    camera.y += (activeShip.y - canvas.height / 2 - camera.y) * 0.1;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Katto
    ctx.fillStyle = '#181b28'; ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-camera.x, -camera.y);
    for (let i = 0; i < numSegs; i++) ctx.lineTo(i * segW - camera.x, ceiling[i] - camera.y);
    ctx.lineTo(WORLD.width - camera.x, -camera.y); ctx.fill(); ctx.stroke();

    // Lattia
    ctx.beginPath();
    for (let i = 0; i < numSegs; i++) ctx.lineTo(i * segW - camera.x, floor[i] - camera.y);
    ctx.lineTo(WORLD.width - camera.x, WORLD.height - camera.y); ctx.lineTo(-camera.x, WORLD.height - camera.y);
    ctx.fill(); ctx.stroke();

    // Energiaseinät
    ctx.fillStyle = '#ff3366';
    ctx.fillRect(0 - camera.x, 0, 30, WORLD.height);
    ctx.fillRect(WORLD.width - 30 - camera.x, 0, 30, WORLD.height);

    // Esteet
    ctx.fillStyle = '#181b28'; ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 3;
    obstacles.forEach(o => {
      ctx.beginPath(); ctx.arc(o.x - camera.x, o.y - camera.y, o.radius, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    });

    // Tukikohdat
    ctx.strokeStyle = '#00ff66'; ctx.lineWidth = 5;
    bases.forEach(b => {
      ctx.beginPath(); ctx.moveTo(b.x1 - camera.x, b.y - camera.y); ctx.lineTo(b.x2 - camera.x, b.y - camera.y); ctx.stroke();
    });

    particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x - camera.x, p.y - camera.y, 3, 3); });
    ctx.fillStyle = '#ffcc00';
    bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x - camera.x, b.y - camera.y, 3, 0, Math.PI * 2); ctx.fill(); });

    if (isSinglePlayer) ships[0].draw(); else ships.forEach(s => s.draw());

    // TUTKA
    const mapW = 200, mapH = 120, mapX = canvas.width - mapW - 20, mapY = 60;
    ctx.fillStyle = 'rgba(5, 8, 15, 0.85)'; ctx.fillRect(mapX, mapY, mapW, mapH);
    ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 1; ctx.strokeRect(mapX, mapY, mapW, mapH);
    ctx.strokeStyle = 'rgba(0, 255, 204, 0.4)';

    ctx.beginPath();
    for (let i = 0; i < numSegs; i += 2) {
      let mx = mapX + (i * segW / WORLD.width) * mapW, my = mapY + (ceiling[i] / WORLD.height) * mapH;
      if (i === 0) ctx.moveTo(mx, my); else ctx.lineTo(mx, my);
    }
    ctx.stroke();

    ctx.beginPath();
    for (let i = 0; i < numSegs; i += 2) {
      let mx = mapX + (i * segW / WORLD.width) * mapW, my = mapY + (floor[i] / WORLD.height) * mapH;
      if (i === 0) ctx.moveTo(mx, my); else ctx.lineTo(mx, my);
    }
    ctx.stroke();

    ctx.fillStyle = 'rgba(0, 255, 204, 0.5)';
    obstacles.forEach(o => {
      let mx = mapX + (o.x / WORLD.width) * mapW, my = mapY + (o.y / WORLD.height) * mapH, mr = (o.radius / WORLD.width) * mapW;
      ctx.beginPath(); ctx.arc(mx, my, Math.max(1, mr), 0, Math.PI * 2); ctx.fill();
    });

    ctx.strokeStyle = '#00ff66'; ctx.lineWidth = 2;
    bases.forEach(b => {
      let mx1 = mapX + (b.x1 / WORLD.width) * mapW, mx2 = mapX + (b.x2 / WORLD.width) * mapW, my = mapY + (b.y / WORLD.height) * mapH;
      ctx.beginPath(); ctx.moveTo(mx1, my); ctx.lineTo(mx2, my); ctx.stroke();
    });

    let radarShips = isSinglePlayer ? [ships[0]] : ships;
    radarShips.forEach(s => {
      if (!s.isDead) {
        let sx = mapX + (s.x / WORLD.width) * mapW, sy = mapY + (s.y / WORLD.height) * mapH;
        ctx.fillStyle = s.color; ctx.fillRect(sx - 2, sy - 2, 4, 4);
      }
    });

    document.getElementById('p1-hud').innerText = `P1 HP: ${Math.ceil(ships[0].hp)} | FUEL: ${Math.ceil(ships[0].fuel)} | KILLS: ${ships[0].kills}`;
    if (!isSinglePlayer) {
      document.getElementById('p2-hud').innerText = `P2 HP: ${Math.ceil(ships[1].hp)} | FUEL: ${Math.ceil(ships[1].fuel)} | KILLS: ${ships[1].kills}`;
    }

    requestAnimationFrame(loop);
  }
  loop();
}

function syncGameState(data) {
  if (!data) return;
  matchTime = data.matchTime !== undefined ? data.matchTime : matchTime;
  matchEnded = data.matchEnded !== undefined ? data.matchEnded : matchEnded;
  if (matchEnded && document.getElementById('game-over').style.display !== 'flex') endMatch();
  else if (!matchEnded && document.getElementById('game-over').style.display === 'flex') document.getElementById('game-over').style.display = 'none';

  if (data.ships) {
    data.ships.forEach((s, idx) => {
      ships[idx].x = s.x; ships[idx].y = s.y; ships[idx].angle = s.angle;
      ships[idx].hp = s.hp; ships[idx].fuel = s.fuel; ships[idx].kills = s.kills;
      ships[idx].isDead = s.isDead; ships[idx].dockedBase = s.dockedBase;
    });
  }
  if (data.bullets) bullets.splice(0, bullets.length, ...data.bullets);
  if (data.particles) particles.splice(0, particles.length, ...data.particles);
}

  statusEl.innerText = "Ladataan verkkokirjastoa...";
  let script = document.createElement('script');
  script.src = "https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js";
  script.onload = callback;
  script.onerror = () => { statusEl.innerText = "Verkkokirjaston lataus epäonnistui."; };
  document.head.appendChild(script);
}
